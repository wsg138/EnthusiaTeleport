name: Build

on:
  push:
    branches:
      - main
      - feat/named-bed-homes
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify CombatLogX API contract
        shell: bash
        run: |
          set -euo pipefail

          assert_contains() {
            local needle="$1"
            local file="$2"
            local description="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "CombatLogX contract check failed: ${description}" >&2
              return 1
            fi
          }

          verify_ref() {
            local ref="$1"
            local base="https://raw.githubusercontent.com/SirBlobman/CombatLogX/${ref}"
            local dir
            dir="$(mktemp -d)"

            curl --fail --silent --show-error --location \
              "${base}/api/src/main/java/com/github/sirblobman/combatlogx/api/manager/ICombatManager.java" \
              -o "${dir}/ICombatManager.java"
            curl --fail --silent --show-error --location \
              "${base}/api/src/main/java/com/github/sirblobman/combatlogx/api/event/PlayerTagEvent.java" \
              -o "${dir}/PlayerTagEvent.java"
            curl --fail --silent --show-error --location \
              "${base}/api/src/main/java/com/github/sirblobman/combatlogx/api/event/CustomPlayerEvent.java" \
              -o "${dir}/CustomPlayerEvent.java"
            curl --fail --silent --show-error --location \
              "${base}/plugin/src/main/java/com/github/sirblobman/combatlogx/CombatPlugin.java" \
              -o "${dir}/CombatPlugin.java"
            curl --fail --silent --show-error --location \
              "${base}/plugin/gradle.properties" \
              -o "${dir}/plugin-gradle.properties"

            assert_contains 'boolean isInCombat(@NotNull Player player);' \
              "${dir}/ICombatManager.java" "isInCombat(Player) is missing at ${ref}"
            assert_contains 'public final class PlayerTagEvent extends CustomPlayerEvent' \
              "${dir}/PlayerTagEvent.java" "PlayerTagEvent moved or changed at ${ref}"
            assert_contains 'public abstract class CustomPlayerEvent extends PlayerEvent' \
              "${dir}/CustomPlayerEvent.java" "PlayerTagEvent no longer inherits Bukkit PlayerEvent at ${ref}"
            assert_contains 'public @NotNull ICombatManager getCombatManager()' \
              "${dir}/CombatPlugin.java" "getCombatManager() is missing at ${ref}"
            assert_contains 'bukkit.plugin.name=CombatLogX' \
              "${dir}/plugin-gradle.properties" "plugin name CombatLogX changed at ${ref}"
          }

          # 11.6 release-line source immediately before the 11.6.0.0.1286 bundle.
          verify_ref fb04b2959c139ad8c556e161e968a295a4d5f958
          # Vetted 11.7 development head from the integration audit.
          verify_ref 113228f3860b3d52687bb3da0f9b8ee7af6eae9c
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaTeleport
          path: target/EnthusiaTeleport-*.jar
          if-no-files-found: error

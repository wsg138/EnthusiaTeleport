name: Build

on:
  push:
    branches:
      - main
      - feat/named-bed-homes
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaTeleport
          path: target/EnthusiaTeleport-*.jar
          if-no-files-found: error
